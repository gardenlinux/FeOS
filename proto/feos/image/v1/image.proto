syntax = "proto3";

package feos.image.v1;

// Image Service

// ImageService handles the lifecycle of OCI images used for booting VMs.
service ImageService {
  // Initiates the pull of an OCI image from a remote registry.
  // This call is non-blocking. It returns a UUID for the image immediately,
  // which can then be used to track the download status.
  // Images are immutable and shared: pulling a reference that is present or
  // being pulled returns that image's UUID, unless the request is
  // `exclusive`. Delete an image to pull its reference anew.
  rpc PullImage(PullImageRequest) returns (PullImageResponse);

  // Watches the status of an image pull operation. This is a server-streaming
  // call that will send updates as the image's state changes. The stream
  // closes when the image pull reaches a terminal state (READY or PULL_FAILED).
  rpc WatchImageStatus(WatchImageStatusRequest) returns (stream ImageStatusResponse);

  // Lists all images available locally in the service's cache.
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);

  // Removes a locally cached image. Fails with FAILED_PRECONDITION while
  // the image is in use: while a container's root has it as a layer, or a
  // VM's jail links its files.
  rpc DeleteImage(DeleteImageRequest) returns (DeleteImageResponse);
}

enum ImageState {
  IMAGE_STATE_UNSPECIFIED = 0;
  // The requested image UUID is not known to the service.
  NOT_FOUND = 1;
  // The image pull is in progress.
  DOWNLOADING = 2;
  // The image is downloaded, unpacked, and ready for use.
  READY = 3;
  // The image pull failed. The 'message' field in ImageStatusResponse will have details.
  PULL_FAILED = 4;
}

message ImageInfo {
  // Server-generated unique ID for the image.
  string image_uuid = 1;
  // The original reference used to pull the image (e.g., "alpine:latest").
  string image_ref = 2;
  // The current state of the image.
  ImageState state = 3;
  // Digest of the image config, the image's content id. Set once READY.
  string digest = 4;
  // Compressed size of the config and the layers. Set once READY.
  uint64 size_bytes = 5;
  // Pulled with `exclusive`: no other pull is handed this image.
  bool exclusive = 6;
}

message PullImageRequest {
  // The full reference to the OCI image, including the registry and tag.
  // e.g., "docker.io/library/alpine:latest". Short forms are normalized like
  // docker does ("alpine" is "docker.io/library/alpine:latest").
  string image_ref = 1;
  // Pull into a new image that is handed to nobody else, even if the
  // reference is present. For consumers that write to the image's files,
  // such as a VM using its disk image.
  bool exclusive = 2;
  // A Bearer token of the image's registry (ADR 0025), held in memory for
  // the pull and never stored. Empty: anonymous. A pull that joins one
  // in flight or an image that is there takes neither's token.
  string pull_token = 3;
}

message PullImageResponse {
  // The server-generated unique ID for the image being pulled.
  // Use this UUID to watch the download status and to create a VM.
  string image_uuid = 1;
}

message WatchImageStatusRequest {
  string image_uuid = 1;
}

message ImageStatusResponse {
  ImageState state = 1;
  // Optional: Progress percentage (0-100) when state is DOWNLOADING.
  uint32 progress_percent = 2;
  // Optional: A human-readable message, especially useful for PULL_FAILED state.
  string message = 3;
}

message ListImagesRequest {}

message ListImagesResponse {
  repeated ImageInfo images = 1;
}

message DeleteImageRequest {
  string image_uuid = 1;
}

message DeleteImageResponse {}
