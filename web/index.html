<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>FeRun</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script>
      // The theme before the first paint, so that the page never flashes
      // the other one. Storage may be unavailable (private windows).
      (function () {
        var theme = 'dark';
        try { theme = localStorage.getItem('ferun-theme') || 'dark'; } catch (e) { /* default */ }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
