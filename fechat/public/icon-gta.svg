  <!-- The tab's icon in the Vice City theme: the header's bolt in the dusk's
       gradient, ringed like the numeral of GTA VI's logo. -->
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5fd6"/>
      <stop offset=".28" stop-color="#7a45c4"/>
      <stop offset=".5" stop-color="#d446c6"/>
      <stop offset=".72" stop-color="#ff7a9c"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb23f"/>
      <stop offset=".55" stop-color="#ff5fb0"/>
