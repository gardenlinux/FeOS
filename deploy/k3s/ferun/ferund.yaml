# ferund (ADR 0015) and its services: the front doors on :8100, the
# nodes' port on :7443 (deploy/k3s/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferund
  namespace: ferun
spec:
  # Instances are identical and any of them serves any request: one on a
  # single machine, three on the Gardener shoot (deploy/gardener/ferun).
  replicas: 1
  revisionHistoryLimit: 3
  # A rolling deploy starts a new instance before it stops an old one and
  # counts it once it has been ready for 10 s: /readyz passes once the
  # nodes have dialled it, at the latest 30 s after its start
  # (docs/architecture/control-plane.md, Stopping).
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ferund
  template:
    metadata:
      labels:
        app: ferund
    spec:
      # The image runs as distroless's nonroot (65532); the group makes the
      # secrets' files below readable to it.
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
      # The instances spread over the machines, at most one more on any
      # than on another (three on three workers: one each). Machines that
      # take no new pods, cordoned or unreachable, do not count, so that a
      # lost machine never keeps a replacement from starting on the others;
      # per revision, so that a rolling deploy spreads the new instances.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: ferund
          matchLabelKeys:
            - pod-template-hash
      # The shutdown grace below and 60 s: a stopping instance lets its tool
      # calls (a call with an id runs at most 600 s; ADR 0023) and
      # operations finish, then closes its node connections.
      terminationGracePeriodSeconds: 720
      containers:
        - name: ferund
          image: ${REGISTRY}/ferund:dev
          imagePullPolicy: Always
          args: ["serve"]
          envFrom:
            - secretRef:
                name: ferund
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FERUN_LISTEN
              value: ":8100"
            - name: FERUN_NODE_LISTEN
              value: ":7443"
            # What the nodes dial to reach this instance: its pod's address,
            # which the hosts reach over the cluster's network.
            - name: FERUN_NODE_ADVERTISE_ADDRESS
              value: "$(POD_IP):7443"
            - name: FERUN_TRUST_DOMAIN
              value: run.${DOMAIN}
            - name: FERUN_CA_DIR
              value: /etc/ferun/ca
            # Paused after 10 s without a tool call, the default; into the
            # object store after another half hour. A paused sandbox costs
            # the node disk only and resumes in a second; a hibernation
            # uploads its disk, minutes for a big image.
            - name: FERUN_HIBERNATE_AFTER
              value: 30m
            - name: FERUN_SHUTDOWN_GRACE
              value: 11m
            # For a network that routes no prefix to the nodes: the pods
            # are on a mesh of a ULA /48 that ferund draws once (ADR 0017).
            - name: FERUN_POD_NETWORK
              value: mesh
            # People sign in to the UI and the admin API at the OpenID
            # Connect provider; its group admins gets the admin surface.
            - name: FERUN_PUBLIC_URL
              value: https://run.${DOMAIN}
            - name: FERUN_OIDC_ISSUER
              value: ${OIDC_ISSUER}
            - name: FERUN_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-client-ferun
                  key: client_id
            - name: FERUN_OIDC_CLIENT_SECRET_FILE
              value: /etc/ferun/oidc/secret
            - name: FERUN_OIDC_ADMIN_GROUP
              value: admins
            - name: FERUN_SESSION_TTL
              value: 12h
            # Seals environments' secrets and addons' credentials at rest.
            - name: FERUN_SECRET_KEY_FILE
              value: /etc/ferun/secret-key/key
          ports:
            - name: http
              containerPort: 8100
            - name: nodes
              containerPort: 7443
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            # A ready instance leaves the balancer after a minute of failing
            # /readyz, so that a database failover (under a minute) does not
            # take every instance out at once. A stopping instance leaves at
            # once, its pod terminating; a starting one joins when /readyz
            # first passes.
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: ca
              mountPath: /etc/ferun/ca
              readOnly: true
            - name: oidc
              mountPath: /etc/ferun/oidc
              readOnly: true
            - name: secret-key
              mountPath: /etc/ferun/secret-key
              readOnly: true
      volumes:
        - name: ca
          secret:
            secretName: ferun-ca
            defaultMode: 0440
        # ferund's client at the provider (README.md).
        - name: oidc
          secret:
            secretName: oidc-client-ferun
            defaultMode: 0440
            items:
              - key: client_secret
                path: secret
        - name: secret-key
          secret:
            secretName: ferund-secret-key
            defaultMode: 0440
---
# A drain stops at most one instance at a time; with a single instance
# that one may go. An instance that is not ready may always be evicted, so
# that a broken one never blocks a drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ferund
  namespace: ferun
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: ferund
---
apiVersion: v1
kind: Service
metadata:
  name: ferund
  namespace: ferun
spec:
  selector:
    app: ferund
  ports:
    - name: http
      port: 8100
      targetPort: http
---
# The nodes' port. feosd runs on the hosts, which do not resolve the
# cluster's names, so the service has a fixed address that the feos
# DaemonSet configures (deploy/k3s/feos): feosd joins and bootstraps there,
# then dials every instance at the address it advertises.
apiVersion: v1
kind: Service
metadata:
  name: ferund-nodes
  namespace: ferun
spec:
  clusterIP: ${FERUN_NODES_IP}
  selector:
    app: ferund
  ports:
    - name: nodes
      port: 7443
      targetPort: nodes
