#
# FeChat's backend: the chat proxy to the LLM, with tool calls over MCP
# into sandboxes of FeRun's ferund. fechat/deploy.sh sets the image's tag.
#
# The Secrets are not in the repository; fechat/README.md says how to make
# them: fechat-backend (OPENAI_API_KEY, OPENAI_BASE_URL, FERUN_TOKEN,
# SESSION_SECRET) and oidc-client-fechat (FeChat's client at the OpenID
# Connect provider).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fechat-backend
  namespace: fechat
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: fechat-backend
  template:
    metadata:
      labels:
        app: fechat-backend
    spec:
      containers:
        - name: fechat-backend
          image: ${REGISTRY}/fechat-backend:0.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: fechat-backend
          env:
            - name: MODEL
              valueFrom:
                configMapKeyRef:
                  name: fechat-backend-config
                  key: model
            - name: SYSTEM_PROMPT_FILE
              value: /etc/fechat/system-prompt.txt
            - name: FERUN_URL
              value: http://ferund.ferun.svc.cluster.local:8100
            # Sign-in at the OpenID Connect provider (backend/auth.go).
            - name: OIDC_ISSUER
              value: ${OIDC_ISSUER}
            - name: PUBLIC_URL
              value: https://chat.${DOMAIN}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-client-fechat
                  key: client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-client-fechat
                  key: client_secret
          volumeMounts:
            - name: config
              mountPath: /etc/fechat
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: fechat-backend-config
---
apiVersion: v1
kind: Service
metadata:
  name: fechat-backend
  namespace: fechat
spec:
  selector:
    app: fechat-backend
  ports:
    - port: 8080
      targetPort: 8080
