# ferun-ingress on the Gardener shoot (ADR 0021, deploy/gardener/README.md,
# The ingress): an instance on every worker the balancer sends to, behind
# a LoadBalancer of their own, beside Envoy Gateway, which goes on serving the
# platform's hosts. Each instance holds
# ferund's routing table, is a peer on the pods' mesh, and proxies
# https://<label>.${APPS_ZONE} straight to the pods. Its program ships in
# ferund's image (/ferun-ingress). The ${...} are the deployment's
# parameters (config.env.example), which make fills in:
#
#   make -C deploy/gardener apply-ferun-ingress
#
# Secrets the operator makes in the namespace, before the pods start:
#   ferun-ingress-join  a key per instance, ferun-ingress-0 to
#                       ferun-ingress-<replicas - 1>: a one-time join
#                       token of kind ingress pinned to each name,
#                       feos-ingress-join-<secret>.<pin> (ferund
#                       join-token --kind ingress --node <name>). Only the
#                       init container mounts it, and copies the pod's own
#                       key into a memory volume that the instance reads:
#                       no instance sees another's token. The copy is
#                       made when the pod starts, so a token put in later
#                       takes a deletion of the pod (never forced). Read
#                       only while an instance keeps no valid certificate;
#                       afterwards its identity is on its volume.
#   ghcr-pull           a token that reads the platform's images on GHCR
#                       (PLATFORM_REGISTRY), as in the namespace ferun.
# cert-manager makes apps-wildcard-tls, the certificate below, through the
# issuer's DNS-01 (cluster.yaml), whose token must edit the zone that
# holds ${APPS_ZONE}.
#
# DNS records the operator creates, DNS only, at the address of the
# Service ferun-ingress (kubectl -n ferun-ingress get svc ferun-ingress):
#   *.${APPS_ZONE}  A <address>
#   *.<TENANT_ZONE> A <address>, with a tenant zone (tenant-zone.yaml)
#   edge.${DOMAIN}  A <address>, reserved for domains later
#
# Never force-delete these pods (--force, --grace-period=0): a pod's name
# is its identity, a mesh key and address, and a second process with it
# makes WireGuard flap between the two until one dies. A pod on a lost
# worker comes back when its Node is deleted.
#
# Nothing is served until a tenant publishes an environment (PUT
# /api/v1/environments/<env>/public); an empty apps zone in ferund
# (FERUN_APPS_ZONE) switches every host off.
apiVersion: v1
kind: Namespace
metadata:
  name: ferun-ingress
---
# One certificate for every host of the zone; the instances read it again
# every 30 s, so a renewal arrives within about two minutes.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apps-wildcard
  namespace: ferun-ingress
spec:
  secretName: apps-wildcard-tls
  dnsNames:
    - "*.${APPS_ZONE}"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
# The StatefulSet's governing Service, which names the pods; its name
# differs from the balancer's.
apiVersion: v1
kind: Service
metadata:
  name: ferun-ingress-pods
  namespace: ferun-ingress
spec:
  clusterIP: None
  selector:
    app: ferun-ingress
  ports:
    - name: health
      port: 9090
      targetPort: health
---
# The public address of the apps zone, with externalTrafficPolicy Local:
# a worker passes a connection only to an instance of its own, without
# rewriting its source, so the instance sees the client's address and
# sets X-Forwarded-For from it. With Cluster, kube-proxy rewrites the
# source to the worker's address. IronCore's load balancer is direct
# server return (the packet reaches the worker unchanged, and the answer
# leaves it straight to the client), so no PROXY protocol can come from
# it, and it checks no node's health (README.md, A lost worker): it sends
# every worker of the cluster its share. Hence an instance on every
# worker it sends to (the StatefulSet below). While one restarts, its
# worker's share of new connections waits, and the clients' SYN retries
# reach the instance once it is ready. A balancer that checks the nodes'
# health (healthCheckNodePort, ironcore#1584) closes that gap.
apiVersion: v1
kind: Service
metadata:
  name: ferun-ingress
  namespace: ferun-ingress
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  selector:
    app: ferun-ingress
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
---
# A drain stops one instance at a time; one that is not ready may always
# be evicted, so that a broken one never blocks a drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ferun-ingress
  namespace: ferun-ingress
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: ferun-ingress
---
# Requests from anywhere; the health port (the kubelet's probes) and the
# mesh (the workers' feos-mesh, UDP) only from the workers' network. The
# mesh device listens on 51820, or on one of the 15 ports after it once an
# instance repaired its paths to nodes it lost (docs/architecture/
# ingress.md, The mesh). What the instances dial: ferun-ingress-egress,
# below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferun-ingress
  namespace: ferun-ingress
spec:
  podSelector:
    matchLabels:
      app: ferun-ingress
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8443 }
    - from:
        - ipBlock:
            cidr: ${NODE_CIDR}
      ports:
        - { protocol: TCP, port: 9090 }
        - { protocol: UDP, port: 51820, endPort: 51835 }
---
# What the instances dial, and nothing else: DNS, ferund's nodes' port,
# the sink's ingest and the workers' feos-mesh. Requests to the apps' pods go inside the
# mesh device, so the network sees only its UDP to the workers. An
# instance taken over through the proxy cannot reach the cluster's other
# services. Calico checks a connection to a Service at the pod and port
# kube-proxy translated it to; another network may check the Service's
# address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferun-ingress-egress
  namespace: ferun-ingress
spec:
  podSelector:
    matchLabels:
      app: ferun-ingress
  policyTypes:
    - Egress
  egress:
    # The cluster's DNS, for a control plane given by name. Gardener's
    # CoreDNS answers on 8053 behind the Service kube-dns's 53.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
        - { protocol: UDP, port: 8053 }
        - { protocol: TCP, port: 8053 }
    # ferund's nodes' port: its pods, and the address of the Service
    # ferund-nodes (FERUN_INGRESS_CONTROL_PLANE).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ferun
          podSelector:
            matchLabels:
              app: ferund
        - ipBlock:
            cidr: ${FERUN_NODES_IP}/32
      ports:
        - { protocol: TCP, port: 7443 }
    # The sink's ingest, for the access log: its instances' addresses,
    # which the headless Service ferun-sink-ingest resolves to
    # (FERUN_INGRESS_SINK_ENDPOINT). The sink has no policy of its own.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ferun
          podSelector:
            matchLabels:
              app: ferun-sink
      ports:
        - { protocol: TCP, port: 4317 }
    # The workers' feos-mesh.
    - to:
        - ipBlock:
            cidr: ${NODE_CIDR}
      ports:
        - { protocol: UDP, port: 51820 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ferun-ingress
  namespace: ferun-ingress
spec:
  # One per worker the balancer sends to: the workers without the label
  # node.kubernetes.io/exclude-from-external-load-balancers, all three on
  # the shoot. A worker more takes an instance more, and its join token.
  replicas: 3
  serviceName: ferun-ingress-pods
  # Scaling starts and stops the pods together. A rollout replaces one
  # at a time and goes on once the new one has been ready for 10 s:
  # /readyz passes once it holds the table and the workers' handshakes
  # are fresh.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  minReadySeconds: 10
  selector:
    matchLabels:
      app: ferun-ingress
  template:
    metadata:
      labels:
        app: ferun-ingress
    spec:
      # An instance on each worker the balancer sends to, never two on
      # one: with Local, a worker without one drops its share. No
      # instance on a worker that carries
      # node.kubernetes.io/exclude-from-external-load-balancers, the
      # label that also takes a worker out of the balancer, once
      # IronCore's cloud controller honours it (cloud-provider-ironcore
      # #618); until then no worker may carry it. An instance whose
      # worker is drained or lost waits for it, or its replacement,
      # rather than join another, where it would serve no one and stay
      # when the worker comes back.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/exclude-from-external-load-balancers
                    operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: ferun-ingress
      automountServiceAccountToken: false
      # The runtime's default seccomp profile, not Unconfined: the
      # netlink the instance configures its mesh device with passes;
      # unshare, setns, keyctl, bpf and userfaultfd do not. The init
      # container is privileged, and so runs without one.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      # On SIGTERM an instance fails /readyz and serves on for
      # --shutdown-delay (10 s), waits for its requests for up to
      # --shutdown-grace (40 s) and releases its holds (2 s); this is
      # above the sum. It delays its own stop, so it needs no preStop.
      terminationGracePeriodSeconds: 60
      initContainers:
        # The mesh device needs IPv6, which the pod's network may leave
        # off: this writes 0 to net.ipv6.conf.{all,default}.disable_ipv6,
        # privileged and as root over the image's user (nonroot). It also
        # copies the pod's own join token, the key $(POD_NAME) of the
        # Secret, to /join/token, which the instance reads; without that
        # key it removes the copy.
        - name: prepare
          image: ${REGISTRY}/ferund:dev
          imagePullPolicy: Always
          command: ["/ferun-ingress", "prepare"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FERUN_INGRESS_JOIN_TOKEN_SOURCE
              value: "/join-secret/$(POD_NAME)"
            - name: FERUN_INGRESS_JOIN_TOKEN_FILE
              value: /join/token
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: join-secret
              mountPath: /join-secret
              readOnly: true
            - name: join
              mountPath: /join
      containers:
        - name: ferun-ingress
          image: ${REGISTRY}/ferund:dev
          imagePullPolicy: Always
          command: ["/ferun-ingress"]
          args: ["serve"]
          # Root with NET_ADMIN alone, for the WireGuard device, its
          # addresses and routes. The proxy shares the process, and so
          # the capability, until the two are split (ADR 0021, open
          # questions).
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The instance's name, its identity at ferund: the pod's.
            - name: FERUN_INGRESS_NAME
              value: "$(POD_NAME)"
            # ferund's nodes' port: the fixed ClusterIP of the service
            # ferund-nodes (deploy/gardener/ferun), and the name its
            # certificate carries.
            - name: FERUN_INGRESS_CONTROL_PLANE
              value: "${FERUN_NODES_IP}:7443"
            - name: FERUN_INGRESS_CONTROL_PLANE_NAME
              value: "ferun.run.${DOMAIN}"
            - name: FERUN_INGRESS_TRUST_DOMAIN
              value: "run.${DOMAIN}"
            # The access log goes into the sink (ADR 0026 §8), with the
            # instance's certificate, as streams of the services it
            # served; the instance resolves the headless Service itself.
            # Without it, the access log is not kept.
            - name: FERUN_INGRESS_SINK_ENDPOINT
              value: "ferun-sink-ingest.ferun.svc.cluster.local:4317"
            # Its own join token alone, copied by the init container; the
            # Secret of every instance's token is not mounted here.
            - name: FERUN_INGRESS_JOIN_TOKEN_FILE
              value: /join/token
            # Listeners on the pod's address, never a wildcard; the
            # balancer maps 80 and 443 to the first two.
            - name: FERUN_INGRESS_LISTEN_HTTP
              value: "$(POD_IP):8080"
            - name: FERUN_INGRESS_LISTEN_HTTPS
              value: "$(POD_IP):8443"
            - name: FERUN_INGRESS_HEALTH_LISTEN
              value: "$(POD_IP):9090"
            # Where the workers reach the mesh device.
            - name: FERUN_INGRESS_MESH_ENDPOINT
              value: "$(POD_IP):51820"
            - name: FERUN_INGRESS_TLS_CERT
              value: /etc/ferun-ingress/tls/tls.crt
            - name: FERUN_INGRESS_TLS_KEY
              value: /etc/ferun-ingress/tls/tls.key
            # The tenant zone's wildcard (tenant-zone.yaml), only with
            # TENANT_ZONE: empty, none (the optional Secret is absent then).
            - name: FERUN_INGRESS_TENANT_ZONE_TLS_CERT
              value: "${TENANT_ZONE_TLS_CERT}"
            - name: FERUN_INGRESS_TENANT_ZONE_TLS_KEY
              value: "${TENANT_ZONE_TLS_KEY}"
            # The container's memory limit in bytes: the instance sets the
            # Go runtime's soft limit (GOMEMLIMIT) to 90% of it, so that
            # garbage collection works harder before the kernel kills it.
            # GOMEMLIMIT itself cannot be set here: resourceFieldRef gives
            # the whole limit, and only in fixed units. The default caps
            # fit 1536Mi: a held request takes at most about 250 KiB and a
            # forwarded one about 350 KiB (HTTP/2 with its body's window of
            # 64 KiB full, unread, and 32 KiB of path and headers), so 1024
            # held (--max-held) take about 250 MiB and 2048 forwarded
            # (--max-inflight) about 700 MiB, together 950 MiB below the
            # soft limit of 1.35 GiB with room for the client connections;
            # raise the caps and this limit together. The window is fixed:
            # it slows HTTP/2 uploads over long round trips, 64 KiB per
            # round trip (docs/architecture/ingress.md, Limits).
            - name: FERUN_INGRESS_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: ferun-ingress
                  resource: limits.memory
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 9090
            - name: wireguard
              containerPort: 51820
              protocol: UDP
          # A stopping or broken instance leaves the balancer within 4 s.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 1536Mi }
          volumeMounts:
            # The identity (key and certificate), the mesh key, the
            # routing table's cache: kept across restarts.
            - name: state
              mountPath: /var/lib/ferun-ingress
            - name: tls
              mountPath: /etc/ferun-ingress/tls
              readOnly: true
            - name: tenant-tls
              mountPath: /etc/ferun-ingress/tenant-tls
              readOnly: true
            - name: join
              mountPath: /join
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: apps-wildcard-tls
            defaultMode: 0400
        # Optional: there is none without TENANT_ZONE.
        - name: tenant-tls
          secret:
            secretName: tenant-wildcard-tls
            defaultMode: 0400
            optional: true
        # Every instance's token: the init container's alone.
        - name: join-secret
          secret:
            secretName: ferun-ingress-join
            optional: true
            defaultMode: 0400
        # The pod's own token, in memory.
        - name: join
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
