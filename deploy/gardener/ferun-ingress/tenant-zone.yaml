# The tenant zone's wildcard (ADR 0031), only with TENANT_ZONE: the hosts
# of the tenants people make, <label>.${TENANT_ZONE}. The instances mount
# tenant-wildcard-tls beside apps-wildcard-tls and serve it for every name
# it covers. The issuer's DNS-01 token must edit the zone that holds
# ${TENANT_ZONE}; the operator publishes *.${TENANT_ZONE} A <address> of
# the Service ferun-ingress, DNS only.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tenant-wildcard
  namespace: ferun-ingress
spec:
  secretName: tenant-wildcard-tls
  dnsNames:
    - "*.${TENANT_ZONE}"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
