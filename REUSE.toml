version = 1
SPDX-PackageName = "FeOS"
SPDX-PackageSupplier = "IronCore authors <ospo@sap.com>"
SPDX-PackageDownloadLocation = "https://github.com/gardenlinux/FeOS"


[[annotations]]
path = [
    ".github/**",
    "CODEOWNERS",
    "Makefile",
    "README.md",
    "Cargo.lock",
    "Cargo.toml",
    ".gitignore",
    "CLAUDE.md",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "**/Cargo.toml",
    "**/*.rs",
    "**/*.sql",
    "**/*.json",
    "**/clippy.toml",
    "**/*.proptest-regressions",
    "proto/**/*.proto",
    "go/go.mod",
    "go/go.sum",
    "go/gen/**",
    "go/internal/ui/dist/.keep",
    "fechat/backend/go.mod",
    "fechat/backend/go.sum"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company and IronCore contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "hack/**",
    "docs/**",
    "**/README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company and IronCore contributors"
SPDX-License-Identifier = "Apache-2.0"

# The OpenTelemetry protocol's protos (opentelemetry-proto v1.5.0), as they
# are: the sink takes OTLP (ADR 0026).
[[annotations]]
path = ["proto/opentelemetry/**"]
precedence = "override"
SPDX-FileCopyrightText = "The OpenTelemetry Authors"
SPDX-License-Identifier = "Apache-2.0"

# JetBrains Mono v2.304, the UI's monospace face, as released (its
# webfonts, three weights).
[[annotations]]
path = ["web/src/fonts/JetBrainsMono-*.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# Share Tech Mono, the face of FeRun's name as of FeCode's, Google Fonts'
# latin webfont (v16).
[[annotations]]
path = ["web/src/fonts/ShareTechMono-Regular.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2012 Carrois Type Design, Ralph du Carrois, with Reserved Font Name 'Share'"
SPDX-License-Identifier = "OFL-1.1"

# IBM Plex Sans, the UI's face as FeCode's, Google Fonts' latin webfont
# (v23, one variable file for every weight).
[[annotations]]
path = ["web/src/fonts/IBMPlexSans-Latin.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp. with Reserved Font Name 'Plex'"
SPDX-License-Identifier = "OFL-1.1"
