name: FeOS OCI Release

on:
  push:
    branches:
      - master
    tags:
    - '*'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  oci_release:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: |
          ghcr.io/${{ github.repository }}/feos
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
        flavor: |
          latest=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    - name: Install Build Dependencies
      # As the release workflow's: the host image carries the guest, whose
      # kernel builds natively.
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler musl-tools cpio zstd file \
          flex bison bc libelf-dev libssl-dev

    - name: Setup ORAS
      uses: oras-project/setup-oras@v1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust Toolchain
      # Installs the toolchain rust-toolchain.toml pins.
      run: rustup toolchain install

    - name: Set up cargo cache
      uses: actions/cache@v4
      continue-on-error: false
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Run Tests
      # The integration tests need root. sudo keeps no environment (the
      # runner's sudo ignores -E), so the toolchain's is passed on.
      run: |
        sudo env "PATH=$HOME/.cargo/bin:$PATH" "CARGO_HOME=$HOME/.cargo" "RUSTUP_HOME=$HOME/.rustup" \
          RUST_BACKTRACE=1 sh -c 'make test && make clean'

    - name: Build build-container
      run: make build-container

    - name: Set up kernel cache
      uses: actions/cache@v4
      continue-on-error: false
      with:
        path: |
          target/kernel/
        key: ${{ runner.os }}-kernel-${{ hashFiles('hack/kernel/**') }}
        restore-keys: ${{ runner.os }}-kernel-${{ hashFiles('hack/kernel/**') }}

    - name: Build Kernel
      run: make kernel

    - name: Build initramfs
      run: make initramfs

    - name: Build UKI
      run: |
        echo "console=tty0 console=ttyS0,115200 earlyprintk=ttyS0,115200 consoleblank=0" > target/cmdline
        mkdir keys
        echo "${{ secrets.SECUREBOOT_PRIVATEKEY }}" > keys/secureboot.key
        echo "${{ secrets.SECUREBOOT_CERTIFICATE }}" > keys/secureboot.pem
        openssl x509 -in keys/secureboot.pem -out keys/feos.crt -outform DER
        make uki

    - name: Create Config JSON
      run: |
        jq -n --arg cmdline "$(cat target/cmdline)" --arg version "${{ github.ref_name }}" \
          '{commandLine: $cmdline, "os-release": $version}' > config.json

    - name: Build rootfs img
      run: |
        ROOTFS_IMG="rootfs.img"
        echo "ROOTFS_IMG=$ROOTFS_IMG" >> $GITHUB_ENV
        dd if=/dev/zero of="$ROOTFS_IMG" bs=1M count=128
        echo -e "label: gpt \nsize=100MiB, type=C12A7328-F81F-11D2-BA4B-00A0C93EC93B, name=\"EFI system partition\"" | sfdisk $ROOTFS_IMG
        LOOP_DEVICE=$(losetup -f)
        sudo losetup "$LOOP_DEVICE" "$ROOTFS_IMG" -P
        sudo mkfs.vfat ${LOOP_DEVICE}p1
        MOUNT_DIR=$(mktemp -d)
        sudo mount "$LOOP_DEVICE"p1 "$MOUNT_DIR"
        sudo mkdir -p  "$MOUNT_DIR/EFI/BOOT"
        sudo cp --no-preserve=ownership target/uki.efi "$MOUNT_DIR/EFI/BOOT/BOOTX64.EFI"
        sudo umount "$MOUNT_DIR"
        sudo losetup -d "$LOOP_DEVICE"
        sudo rmdir "$MOUNT_DIR"

    - name: Push Image with ORAS (Version Tag)
      run: |
        ROOTFS_IMG=${{ env.ROOTFS_IMG }}
        oras push ${{ steps.meta.outputs.tags }} \
        $ROOTFS_IMG:application/io.gardenlinux.squashfs \
        target/initramfs.zst:application/io.gardenlinux.initrd \
        target/kernel/vmlinuz:application/io.gardenlinux.kernel \
        --config config.json:application/vnd.unknown.config.v1+json
