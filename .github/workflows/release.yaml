name: FeOS Release

on:
  push:
    tags:
    - '*'

jobs:
  build_release:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      # The host image carries the guest, which builds natively.
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler musl-tools cpio zstd file \
          flex bison bc libelf-dev libssl-dev

    - name: Install Rust Toolchain
      # Installs the toolchain rust-toolchain.toml pins.
      run: rustup toolchain install

    - name: Run Tests
      # The integration tests need root and run in the test workflow.
      run: make test-unit

    - name: Build build-container
      run: make build-container

    - name: Build Kernel
      run: make kernel

    - name: Build initramfs
      run: make initramfs

    - name: Build UKI
      run: |
        mkdir keys
        echo "${{ secrets.SECUREBOOT_PRIVATEKEY }}" > keys/secureboot.key
        echo "${{ secrets.SECUREBOOT_CERTIFICATE }}" > keys/secureboot.pem
        openssl x509 -in keys/secureboot.pem -out keys/feos.crt -outform DER
        make uki
        mv target/uki.efi target/feos-${{ github.ref_name }}-x86_64.efi

    - name: Release
      uses: softprops/action-gh-release@v2
      id: create_release
      with:
        name: FeOS ${{ github.ref_name }}
        body_path: docs/changelog/FeOS-${{ github.ref_name }}.md
        files: |
          target/feos-${{ github.ref_name }}-x86_64.efi
          keys/feos.crt
